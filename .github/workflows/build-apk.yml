name: Build One-File Keyboard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -e
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses > /dev/null
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Project Files
        run: |
          set -e
          mkdir -p app/src/main/java/com/malikfiaz/customkeyboard
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MalikCustomKeyboard"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.malikfiaz.customkeyboard'
              compileSdk 34

              defaultConfig {
                  applicationId "com.malikfiaz.customkeyboard"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <service
                      android:name=".MyCustomKeyboardService"
                      android:exported="true"
                      android:label="@string/keyboard_name"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>

                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:isDefault="false" />
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Malik Keyboard</string>
              <string name="keyboard_name">Malik Custom Keyboard</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="KeyBtn">
                  <item name="android:layout_width">0dp</item>
                  <item name="android:layout_height">match_parent</item>
                  <item name="android:layout_weight">1</item>
                  <item name="android:layout_margin">2dp</item>
                  <item name="android:textColor">#FFFFFF</item>
                  <item name="android:textSize">15sp</item>
              </style>

              <style name="ActionKeyBtn" parent="KeyBtn">
                  <item name="android:textSize">11sp</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/layout/keyboard_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/keyboardRoot"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="#0F172A"
              android:orientation="vertical"
              android:padding="6dp">

              <LinearLayout
                  android:id="@+id/topBar"
                  android:layout_width="match_parent"
                  android:layout_height="42dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingHorizontal="4dp">

                  <TextView
                      android:id="@+id/brandBanner"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="MALIK FIAZ • DARK HACKER KEYBOARD"
                      android:textColor="#38BDF8"
                      android:textSize="12sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnTheme"
                      android:layout_width="wrap_content"
                      android:layout_height="34dp"
                      android:layout_marginEnd="4dp"
                      android:text="THEME"
                      android:textColor="#FFFFFF"
                      android:textSize="10sp" />

                  <Button
                      android:id="@+id/btnLang"
                      android:layout_width="wrap_content"
                      android:layout_height="34dp"
                      android:text="EN"
                      android:textColor="#FFFFFF"
                      android:textSize="11sp" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="46dp"
                  android:orientation="horizontal">
                  <Button style="@style/KeyBtn" android:text="q" />
                  <Button style="@style/KeyBtn" android:text="w" />
                  <Button style="@style/KeyBtn" android:text="e" />
                  <Button style="@style/KeyBtn" android:text="r" />
                  <Button style="@style/KeyBtn" android:text="t" />
                  <Button style="@style/KeyBtn" android:text="y" />
                  <Button style="@style/KeyBtn" android:text="u" />
                  <Button style="@style/KeyBtn" android:text="i" />
                  <Button style="@style/KeyBtn" android:text="o" />
                  <Button style="@style/KeyBtn" android:text="p" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="46dp"
                  android:orientation="horizontal">
                  <Button style="@style/KeyBtn" android:text="a" />
                  <Button style="@style/KeyBtn" android:text="s" />
                  <Button style="@style/KeyBtn" android:text="d" />
                  <Button style="@style/KeyBtn" android:text="f" />
                  <Button style="@style/KeyBtn" android:text="g" />
                  <Button style="@style/KeyBtn" android:text="h" />
                  <Button style="@style/KeyBtn" android:text="j" />
                  <Button style="@style/KeyBtn" android:text="k" />
                  <Button style="@style/KeyBtn" android:text="l" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="46dp"
                  android:orientation="horizontal">
                  <Button android:id="@+id/btnShift" style="@style/ActionKeyBtn" android:text="⇧" />
                  <Button style="@style/KeyBtn" android:text="z" />
                  <Button style="@style/KeyBtn" android:text="x" />
                  <Button style="@style/KeyBtn" android:text="c" />
                  <Button style="@style/KeyBtn" android:text="v" />
                  <Button style="@style/KeyBtn" android:text="b" />
                  <Button style="@style/KeyBtn" android:text="n" />
                  <Button style="@style/KeyBtn" android:text="m" />
                  <Button android:id="@+id/btnDel" style="@style/ActionKeyBtn" android:text="⌫" />
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="46dp"
                  android:orientation="horizontal">
                  <Button android:id="@+id/btn123" style="@style/ActionKeyBtn" android:text="?123" />
                  <Button android:id="@+id/btnSpace" style="@style/KeyBtn" android:layout_weight="4" android:text="Malik Keyboard" />
                  <Button android:id="@+id/btnEnter" style="@style/ActionKeyBtn" android:text="↵" />
              </LinearLayout>

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/malikfiaz/customkeyboard/MyCustomKeyboardService.java
          package com.malikfiaz.customkeyboard;

          import android.animation.ArgbEvaluator;
          import android.animation.ValueAnimator;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.inputmethodservice.InputMethodService;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.InputConnection;
          import android.widget.Button;
          import android.widget.TextView;

          public class MyCustomKeyboardService extends InputMethodService {

              private boolean isUpperCase = false;
              private int langIndex = 0;
              private int themeIndex = 0;

              private final String[] langs = {"EN", "UR", "AR", "HI"};

              // Themes: [0]=Cyber Blue, [1]=Neon Purple, [2]=Emerald Hacker, [3]=Crimson Dark
              private final String[] themeNames = {"CYBER", "NEON", "MATRIX", "CRIMSON"};
              private final int[] accentColors = {
                  Color.parseColor("#38BDF8"),
                  Color.parseColor("#C084FC"),
                  Color.parseColor("#22C55E"),
                  Color.parseColor("#F43F5E")
              };
              private final int[] keyColors = {
                  Color.parseColor("#1E293B"),
                  Color.parseColor("#2E1065"),
                  Color.parseColor("#052E16"),
                  Color.parseColor("#4C0519")
              };

              // Moving background colors
              private final int[] movingBgPalette = {
                  Color.parseColor("#090D16"),
                  Color.parseColor("#131B2E"),
                  Color.parseColor("#1E1138"),
                  Color.parseColor("#0A221A"),
                  Color.parseColor("#280B18"),
                  Color.parseColor("#090D16")
              };

              private final String[] row1En = {"q","w","e","r","t","y","u","i","o","p"};
              private final String[] row2En = {"a","s","d","f","g","h","j","k","l"};
              private final String[] row3En = {"z","x","c","v","b","n","m"};

              private final String[] row1Ur = {"ق","و","ع","ر","ت","ے","ء","ی","ہ","پ"};
              private final String[] row2Ur = {"ا","س","د","ف","گ","ح","ج","ک","ل"};
              private final String[] row3Ur = {"ز","ش","چ","ط","ب","ن","م"};

              private final String[] row1Ar = {"ض","ص","ث","ق","ف","غ","ع","ه","خ","ح"};
              private final String[] row2Ar = {"ش","س","ي","ب","ل","ا","ت","ن","م"};
              private final String[] row3Ar = {"ئ","ء","ؤ","ر","لا","ى","ة"};

              private final String[] row1Hi = {"ौ","ै","ा","ी","ू","ब","ह","ग","द","ज"};
              private final String[] row2Hi = {"ो","े","्","ि","ु","प","र","क","त"};
              private final String[] row3Hi = {"ं","म","न","व","ल","स","य"};

              private View rootView;
              private ValueAnimator bgAnimator;

              @Override
              public View onCreateInputView() {
                  rootView = getLayoutInflater().inflate(R.layout.keyboard_layout, null);
                  setupControls(rootView);
                  applyTheme(rootView);
                  startMovingBackground(rootView);
                  applyKeyLabels(rootView);
                  return rootView;
              }

              @Override
              public void onFinishInputView(boolean finishingInput) {
                  super.onFinishInputView(finishingInput);
                  if (bgAnimator != null && bgAnimator.isRunning()) {
                      bgAnimator.pause();
                  }
              }

              @Override
              public void onStartInputView(android.view.inputmethod.EditorInfo info, boolean restarting) {
                  super.onStartInputView(info, restarting);
                  if (bgAnimator != null && bgAnimator.isPaused()) {
                      bgAnimator.resume();
                  }
              }

              private void startMovingBackground(View parent) {
                  if (bgAnimator != null) {
                      bgAnimator.cancel();
                  }
                  bgAnimator = ValueAnimator.ofObject(new ArgbEvaluator(),
                      movingBgPalette[0],
                      movingBgPalette[1],
                      movingBgPalette[2],
                      movingBgPalette[3],
                      movingBgPalette[4],
                      movingBgPalette[5]
                  );
                  bgAnimator.setDuration(7000);
                  bgAnimator.setRepeatCount(ValueAnimator.INFINITE);
                  bgAnimator.setRepeatMode(ValueAnimator.RESTART);
                  bgAnimator.addUpdateListener(animator -> {
                      int animatedColor = (int) animator.getAnimatedValue();
                      parent.setBackgroundColor(animatedColor);
                  });
                  bgAnimator.start();
              }

              private void applyTheme(View parent) {
                  int accent = accentColors[themeIndex];
                  int keyBg = keyColors[themeIndex];

                  TextView banner = parent.findViewById(R.id.brandBanner);
                  if (banner != null) {
                      banner.setTextColor(accent);
                      banner.setText("MALIK FIAZ • " + themeNames[themeIndex] + " KEYBOARD");
                  }

                  Button btnTheme = parent.findViewById(R.id.btnTheme);
                  if (btnTheme != null) {
                      btnTheme.setText(themeNames[themeIndex]);
                  }

                  if (parent instanceof ViewGroup) {
                      styleButtonsRecursive((ViewGroup) parent, keyBg, accent);
                  }
              }

              private void styleButtonsRecursive(ViewGroup group, int keyBg, int accent) {
                  for (int i = 0; i < group.getChildCount(); i++) {
                      View child = group.getChildAt(i);
                      if (child instanceof ViewGroup) {
                          styleButtonsRecursive((ViewGroup) child, keyBg, accent);
                      } else if (child instanceof Button) {
                          Button b = (Button) child;
                          GradientDrawable gd = new GradientDrawable();
                          gd.setColor(keyBg);
                          gd.setCornerRadius(14f);
                          int id = b.getId();
                          if (id == R.id.btnEnter || id == R.id.btnTheme) {
                              gd.setStroke(2, accent);
                          } else {
                              gd.setStroke(1, Color.parseColor("#33FFFFFF"));
                          }
                          b.setBackground(gd);
                          b.setTextColor(Color.WHITE);
                      }
                  }
              }

              private void setupControls(View parent) {
                  Button btnTheme = parent.findViewById(R.id.btnTheme);
                  if (btnTheme != null) {
                      btnTheme.setOnClickListener(v -> {
                          themeIndex = (themeIndex + 1) % themeNames.length;
                          applyTheme(parent);
                      });
                  }

                  Button btnLang = parent.findViewById(R.id.btnLang);
                  if (btnLang != null) {
                      btnLang.setOnClickListener(v -> {
                          langIndex = (langIndex + 1) % langs.length;
                          btnLang.setText(langs[langIndex]);
                          applyKeyLabels(parent);
                      });
                  }

                  Button btnShift = parent.findViewById(R.id.btnShift);
                  if (btnShift != null) {
                      btnShift.setOnClickListener(v -> {
                          isUpperCase = !isUpperCase;
                          applyKeyLabels(parent);
                      });
                  }

                  Button btnDel = parent.findViewById(R.id.btnDel);
                  if (btnDel != null) {
                      btnDel.setOnClickListener(v -> {
                          InputConnection ic = getCurrentInputConnection();
                          if (ic != null) {
                              ic.deleteSurroundingText(1, 0);
                          }
                      });
                  }

                  Button btnSpace = parent.findViewById(R.id.btnSpace);
                  if (btnSpace != null) {
                      btnSpace.setOnClickListener(v -> commitText(" "));
                  }

                  Button btnEnter = parent.findViewById(R.id.btnEnter);
                  if (btnEnter != null) {
                      btnEnter.setOnClickListener(v -> {
                          InputConnection ic = getCurrentInputConnection();
                          if (ic != null) 
